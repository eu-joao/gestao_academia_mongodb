[tools]
java = "17"
maven = "3.9.9"

# ==========================================
# Tasks de desenvolvimento
# ==========================================

[tasks.dev-run]
  run = "mvn spring-boot:run"
  description = "Inicia a aplicacao Spring Boot"

[tasks.dev-test]
  run = "mvn test"
  description = "Executa os testes"

[tasks.dev-build]
  run = "mvn clean package"
  description = "Compila e empacota"

[tasks.start]
  run = "mvn spring-boot:run"
  description = "Inicia a aplicacao"
  
[tasks.test]
  run = "mvn test"
  description = "Executa testes"

[tasks.build]
  run = "mvn clean package"
  description = "Build completo"

[tasks.build-no-test]
  run = "mvn clean package -DskipTests"
  description = "Build sem testes"

# ==========================================
# Configuracoes de ambiente
# ==========================================

[env]
