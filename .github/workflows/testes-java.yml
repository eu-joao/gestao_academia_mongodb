name: Testes Java

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  testes:
    name: Testes Maven
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Executar testes
        run: ./mvnw test
